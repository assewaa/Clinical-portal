# Clinical Systems Portal homepage.
# Include inside the intended LAN HTTPS and Tailscale server blocks.
# Do not include in the separate Neurology port 8443 server.

location = / {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_redirect off;
}

location ^~ /portal-static/ {
    alias /home/ubuntu/Documents/Clinical-portal/staticfiles/;
}
